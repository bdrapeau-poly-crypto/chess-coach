name: Neon Restore Drill

on:
  schedule:
    - cron: "41 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: neon-restore-drill
  cancel-in-progress: false

jobs:
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEON_API_KEY: ${{ secrets.NEON_PROJECT_API_KEY }}
      NEON_PROJECT_ID: small-heart-47839613
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install restore dependencies
        run: |
          pip install --requirement backend/requirements.txt
          npm install --global neon@5.0.0
      - name: Create and verify restored branch
        run: |
          set -euo pipefail
          branch_name="restore-drill-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          restore_point="$(date -u -d '-5 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          expires_at="$(date -u -d '+2 hours' '+%Y-%m-%dT%H:%M:%SZ')"
          created=false

          cleanup() {
            if [[ "$created" == true ]]; then
              neon branches delete "$branch_name" --project-id "$NEON_PROJECT_ID" >/dev/null
            fi
          }
          trap cleanup EXIT

          neon branches create \
            --project-id "$NEON_PROJECT_ID" \
            --name "$branch_name" \
            --parent "$restore_point" \
            --expires-at "$expires_at" \
            --no-secrets \
            --output json >/dev/null
          created=true

          DATABASE_URL="$(
            neon connection-string "$branch_name" \
              --project-id "$NEON_PROJECT_ID" \
              --role-name neondb_owner \
              --database-name neondb
          )"
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL

          PYTHONPATH=backend python scripts/verify_neon_restore.py
          (cd backend && alembic current --check-heads)
      - name: Open restore alert
        if: failure()
        run: |
          existing="$(gh issue list --state open --search 'Neon restore drill failed in:title' --json number --jq '.[0].number // empty')"
          if [[ -z "$existing" ]]; then
            gh issue create \
              --title "Neon restore drill failed" \
              --body "The scheduled Neon restore drill failed. Review: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
