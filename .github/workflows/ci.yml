name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install --requirement requirements-dev.txt
      - run: ruff check .
      - run: DATABASE_URL=sqlite:////tmp/chess-coach-ci.db alembic upgrade head
      - run: DATABASE_URL=sqlite:////tmp/chess-coach-ci.db alembic check
      - run: python -m pytest tests --verbose
      - run: docker build --file backend/Dockerfile backend
        working-directory: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  netlify:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trigger the ChessPattern Coach production build
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          url = os.environ.get("NETLIFY_BUILD_HOOK")
          if not url:
              raise SystemExit("The site-specific Netlify build hook is not configured")
          request = urllib.request.Request(
              url, data=b"{}", method="POST",
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  if response.status not in (200, 201, 202):
                      raise SystemExit("Netlify did not accept the production build")
          except urllib.error.URLError:
              raise SystemExit("Could not trigger the Netlify production build") from None
          print("Netlify accepted the ChessPattern Coach production build")
          PY
