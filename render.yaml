services:
  - type: web
    name: chess-coach-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ALLOW_EPHEMERAL_DATABASE
        value: "false"
      - key: AUTH_REQUIRED
        value: "true"
      - key: APP_ACCESS_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
      - key: STOCKFISH_DEPTH
        value: "12"
      - key: STOCKFISH_HASH_MB
        value: "64"
